# TypeWords 静态托管配置（运行在 Dockerfile.static 生成的镜像内）
#
# 说明：
#  - Nuxt generate 产出 index.html（根路径重定向）、200.html（SPA 外壳）、404.html
#  - /words、/setting、/dict、/practice-words/[id] 等均为客户端路由，
#    因此未命中的路径必须回退到 /200.html，由前端路由接管
#  - _nuxt/ 下文件名带内容 hash，可长期缓存

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # 带内容 hash 的构建产物 → 永久缓存
    # 必须用 ^~ 前缀修饰符：普通前缀 location 的优先级低于下方 .js/.css 正则 location，
    # 否则 hash 资源会被按 7 天缓存处理
    location ^~ /_nuxt/ {
        # 只用 add_header，避免与 expires 指令产生重复的 Cache-Control 头
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 词库 json / 音频 / 图片 / 字体等静态资源
    location ~* \.(?:js|mjs|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|json|mp3|wav|ogg)$ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # HTML 不做长缓存，保证发版后刷新即拿到新版本
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri /200.html;
    }

    # SPA 兜底：所有客户端路由交给 200.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /200.html;
    }
}
