services:
  typewords:
    build:
      context: .
      # 如需打标签: docker build -t typewords:latest .
    image: typewords:latest
    container_name: typewords
    restart: unless-stopped
    ports:
      # 宿主机端口可通过 APP_PORT 覆盖，默认 8080（避开本地 pnpm dev 占用的 5567）
      - "${APP_PORT:-8080}:5567"
    environment:
      # ---- 以下变量从项目根目录 .env 自动插值（docker compose 原生行为）----
      # 云同步（Supabase），对应 .env 中的 NUXT_PUBLIC_SUPABASE_URL / NUXT_PUBLIC_SUPABASE_ANON_KEY
      NUXT_PUBLIC_SUPABASE_URL: ${NUXT_PUBLIC_SUPABASE_URL:-}
      NUXT_PUBLIC_SUPABASE_ANON_KEY: ${NUXT_PUBLIC_SUPABASE_ANON_KEY:-}
      # 例句 TTS（Fish Audio）。.env 中叫 FISH_API_KEY，运行时覆盖需要 NUXT_ 前缀
      NUXT_FISH_API_KEY: ${FISH_API_KEY:-}
      # 站点域名（SEO / og url 用），可选
      NUXT_PUBLIC_ORIGIN: ${ORIGIN:-}
    # 可选：资源限制
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
